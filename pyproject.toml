[project]
name = "churn-pred"
version = "0.1.0"
description = "Customer churn prediction - production-ready ML project"
readme = "README.md"
authors = [
    { name = "Abdoulaye DABO", email = "abdoulayedabo@esp.sn" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "joblib>=1.4",
    "shap>=0.46",
]

[project.scripts]
churn-gradio = "churn_pred.app:main"

[project.optional-dependencies]
server = ["gradio>=5.0"]

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

